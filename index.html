<!DOCTYPE html>
<html>
<head>
  <base href="/nexus_club/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nexus Club OS - Управление киберспортивной ареной">

  <!-- Настройки мобильных устройств и PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nexus Club OS">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Nexus Club OS</title>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    /* Базовый темный фон, чтобы не было белой вспышки */
    body {
      background-color: #080C16;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    /* Блок экрана-заглушки (Критерий 14 на оценку «5») */
    #nexus-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Фирменный логотип КИБЕР NEXUS */
    .brand-logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 24px;
      color: #FFFFFF;
    }

    .brand-orange {
      color: #FF5500;
    }

    /* Неоновый спиннер */
    .loader-ring {
      width: 52px;
      height: 52px;
      border: 3px solid rgba(255, 85, 0, 0.15);
      border-top: 3px solid #FF5500;
      border-radius: 50%;
      animation: ring-spin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      box-shadow: 0 0 20px rgba(255, 85, 0, 0.2);
    }

    /* Текст статуса загрузки */
    .status-badge {
      margin-top: 20px;
      font-family: monospace;
      font-size: 11px;
      font-weight: bold;
      color: #94A3B8;
      letter-spacing: 1.5px;
    }

    @keyframes ring-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Экран начальной загрузки (Splash Screen) -->
  <div id="nexus-splash">
    <div class="brand-logo"><span class="brand-orange">КИБЕР</span>NEXUS</div>
    <div class="loader-ring"></div>
    <div class="status-badge">ИНИЦИАЛИЗАЦИЯ АРЕНЫ...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
